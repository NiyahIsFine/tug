name: tug_windows
description: Windows tray host for the shared Tug receive kernel.
publish_to: none
version: 1.0.0
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  tug_core:
    path: ../core
  flutter_local_notifications_windows: 3.1.1
  ffi: ^2.2.0
  win32: ^6.0.1
  win32_registry: 3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/tug.ico
