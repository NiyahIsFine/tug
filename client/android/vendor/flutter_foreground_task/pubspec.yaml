name: flutter_foreground_task
description: Android-only local copy of flutter_foreground_task with alarm restarts disabled.
version: 11.0.3
publish_to: none
homepage: https://github.com/Dev-hwang/flutter_foreground_task
environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.5.5
  platform: ^3.1.6
flutter:
  plugin:
    platforms:
      android:
        package: com.pravera.flutter_foreground_task
        pluginClass: FlutterForegroundTaskPlugin
